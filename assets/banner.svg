<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Astronauts Health Monitor - NASA Space Apps Challenge 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B1F"/>
      <stop offset="0.55" stop-color="#0B1B45"/>
      <stop offset="1" stop-color="#0B3D91"/>
    </linearGradient>
    <linearGradient id="ecg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD1FF" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#4FD1FF" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#4FD1FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4FD1FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#2B6CFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2B6CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="60" cy="40" r="1.4" opacity="0.9"/>
    <circle cx="140" cy="95" r="1" opacity="0.6"/>
    <circle cx="235" cy="30" r="1.6" opacity="0.8"/>
    <circle cx="330" cy="70" r="1" opacity="0.5"/>
    <circle cx="420" cy="25" r="1.2" opacity="0.7"/>
    <circle cx="520" cy="60" r="1" opacity="0.6"/>
    <circle cx="610" cy="20" r="1.5" opacity="0.8"/>
    <circle cx="705" cy="85" r="1" opacity="0.5"/>
    <circle cx="790" cy="35" r="1.3" opacity="0.7"/>
    <circle cx="880" cy="75" r="1" opacity="0.6"/>
    <circle cx="965" cy="22" r="1.6" opacity="0.9"/>
    <circle cx="1050" cy="60" r="1" opacity="0.5"/>
    <circle cx="1130" cy="30" r="1.4" opacity="0.8"/>
    <circle cx="1215" cy="85" r="1.1" opacity="0.6"/>
    <circle cx="95" cy="200" r="1" opacity="0.5"/>
    <circle cx="190" cy="285" r="1.2" opacity="0.6"/>
    <circle cx="300" cy="235" r="1" opacity="0.4"/>
    <circle cx="450" cy="295" r="1.3" opacity="0.6"/>
    <circle cx="560" cy="215" r="1" opacity="0.4"/>
    <circle cx="690" cy="300" r="1.1" opacity="0.5"/>
    <circle cx="840" cy="225" r="1" opacity="0.4"/>
    <circle cx="990" cy="290" r="1.4" opacity="0.6"/>
    <circle cx="1100" cy="215" r="1" opacity="0.5"/>
    <circle cx="1240" cy="270" r="1.2" opacity="0.6"/>
  </g>

  <!-- orbits -->
  <g fill="none" stroke="#7FB2FF" stroke-opacity="0.35" stroke-width="1.2">
    <ellipse cx="1090" cy="110" rx="190" ry="62" transform="rotate(-18 1090 110)"/>
    <ellipse cx="1090" cy="110" rx="130" ry="42" transform="rotate(-18 1090 110)" stroke-opacity="0.25"/>
  </g>
  <circle cx="1090" cy="110" r="26" fill="#0B3D91" stroke="#7FB2FF" stroke-opacity="0.7" stroke-width="1.5"/>
  <circle cx="1090" cy="110" r="26" fill="none" stroke="#4FD1FF" stroke-opacity="0.25" stroke-width="6"/>
  <circle cx="1252" cy="62" r="4.5" fill="#FFFFFF"/>

  <!-- title -->
  <text x="80" y="128" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="6" fill="#7FB2FF">NASA SPACE APPS CHALLENGE 2026</text>
  <text x="80" y="196" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF">Astronauts Health Monitor</text>
  <text x="80" y="236" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#C9D8F5">Health monitoring software for astronauts on space missions</text>

  <!-- heartbeat line -->
  <path d="M0 292 H380 L400 292 L415 272 L430 300 L450 244 L470 328 L490 284 L505 292 H800 L820 292 L835 276 L850 300 L870 258 L890 312 L905 292 H1280" fill="none" stroke="url(#ecg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
